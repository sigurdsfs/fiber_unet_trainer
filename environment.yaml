# Conda environment for fiber_unet_trainer.
#
# Recreate on a new machine - run from the repo root (the folder holding this file),
# because the last pip line installs this project in editable mode from ".":
#
#   conda env create -f environment.yaml
#   conda activate cnn_test
#   pip install --no-deps "pretrained_microscopy_models @ git+https://github.com/nasa/pretrained-microscopy-models@9b7c4abc1321e81eca7a68d548e5371676fa74fa"
#   pytest
#
# If the machine has no git installed, the same pinned commit installs straight from
# the GitHub zip - no git required, same --no-deps rule:
#
#   pip install --no-deps "https://github.com/nasa/pretrained-microscopy-models/archive/9b7c4abc1321e81eca7a68d548e5371676fa74fa.zip"
#
# Why MicroNet (encoder_weights: "micronet") is a separate --no-deps step: NASA's
# pretrained-microscopy-models declares segmentation-models-pytorch==0.2.1 as an EXACT
# pin (plus opencv-python), so listing it below makes pip fail with ResolutionImpossible
# against smp 0.5.0 - and letting pip "fix" that silently downgrades smp and timm for the
# whole environment (see fiberseg/tools/extract_micronet_weights.py). The pin is stale
# metadata: this codebase trains MicroNet encoders on smp 0.5.0 without issue. Skip the
# step entirely if you do not use encoder_weights: "micronet".
#
# Versions are pinned to the cnn_test environment the current code was developed and
# tested against (65 tests passing), so a new machine reproduces it rather than picking
# up whatever is newest on the day.
#
# GPU: torch/torchvision are CUDA 12.6 builds from PyTorch's own index and need an NVIDIA
# driver with CUDA 12.6 support (R560 or newer). For a CPU-only machine, change the index
# URL's "cu126" to "cpu" and drop the "+cu126" suffixes.
#
# The environment name cnn_test is hard-coded in start_mlflow.bat and run_training.bat -
# keep it, or update those scripts if you rename it.

name: cnn_test
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.11.0+cu126
      - torchvision==0.26.0+cu126
      - lightning==2.6.1
      - torchmetrics==1.9.0
      - segmentation-models-pytorch==0.5.0
      - timm==1.0.27
      - albumentations==2.0.8
      - albucore==0.0.24
      # Headless only: the full opencv-python also installs cv2, and having both is only
      # safe when their versions happen to match exactly.
      - opencv-python-headless==4.13.0.92
      - numpy==2.4.3
      - scipy==1.17.1
      - scikit-image==0.26.0
      # Imported at module load by MicroNet (sklearn.feature_extraction.image). Without
      # this pin it only arrives transitively through mlflow, at a different version.
      - scikit-learn==1.8.0
      - tifffile==2026.3.3
      # Required to read the training TIFFs: they are LZW-compressed, and tifffile
      # delegates every compressed codec to imagecodecs. Without it _read_gray dies
      # with "<COMPRESSION.LZW: 5> requires the 'imagecodecs' package" as soon as
      # tiles are built. tifffile does NOT declare it, so it must be listed here.
      - imagecodecs==2026.3.6
      - pillow==12.1.1
      - pandas==2.3.3
      - openpyxl==3.1.5
      - PyYAML==6.0.3
      - tqdm==4.67.3
      - matplotlib==3.10.9
      - mlflow==3.12.0
      - pytest==9.1.1
      - ruff==0.15.20
      - black==26.5.1
      - pre-commit==4.6.0
      - -e .[dev]
